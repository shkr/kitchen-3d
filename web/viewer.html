<title>Kitchen 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* one-screen viewer: the model fills the page, a drawing-sheet style panel floats top-left (bottom sheet on phones) */
:root {
  --bg: #e9ecea; --panel: #fbfcfb; --ink: #1d2422; --muted: #5d6965; --line: #cfd6d3;
  --accent: #d4141e; --chip: #eef2f0;
  --sans: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cond: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161a19; --panel: #202625; --ink: #e6ebe9; --muted: #99a5a1; --line: #36403d; --accent: #ff4a52; --chip: #2a3230; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161a19; --panel: #202625; --ink: #e6ebe9; --muted: #99a5a1; --line: #36403d; --accent: #ff4a52; --chip: #2a3230; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); overflow: hidden; }
#stage { position: fixed; inset: 0 0 var(--sheet, 0px) 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.panel {
  position: fixed; z-index: 2;
  top: calc(16px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  width: 248px; max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 14px 16px; display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 6px 24px rgb(0 0 0 / 0.12);
}
h1 { margin: 0; font-family: var(--cond); font-weight: 600; font-size: 22px; letter-spacing: 0.02em; text-wrap: balance; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.group { display: flex; flex-direction: column; gap: 6px; }
.label { font-family: var(--cond); font-weight: 500; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.views { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.views button {
  font: 500 13px var(--sans); color: var(--ink); background: var(--chip); border: 1px solid var(--line);
  border-radius: 4px; padding: 6px 8px; cursor: pointer; text-align: left;
}
.views button:hover { border-color: var(--muted); }
.views button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; cursor: pointer; padding: 3px 0; }
.toggle small { color: var(--muted); font-size: 12px; }
.toggle input { appearance: none; flex: none; width: 34px; height: 20px; border-radius: 10px; background: var(--line); position: relative; cursor: pointer; transition: background .15s; margin: 0; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); transition: transform .15s; }
.toggle input:checked { background: var(--ink); }
.toggle input:checked::after { transform: translateX(14px); }
.toggle input:focus-visible, .views button:focus-visible, .collapse:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.fold { display: flex; flex-direction: column; gap: 14px; }
.note { font-size: 12px; color: var(--muted); line-height: 1.45; border-top: 1px solid var(--line); padding-top: 10px; }
.note b { color: var(--accent); font-weight: 600; }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.collapse { display: none; font: 600 12px var(--cond); letter-spacing: .08em; text-transform: uppercase; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 4px; padding: 4px 8px; cursor: pointer; }
#status { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; pointer-events: none; }

/* phones and narrow windows: a docked bottom sheet; views always one tap away, layers fold away */
@media (max-width: 640px), (max-height: 520px) and (orientation: portrait) {
  .panel {
    top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 60%;
    border-radius: 14px 14px 0 0; border-width: 1px 0 0; gap: 10px;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    box-shadow: 0 -6px 24px rgb(0 0 0 / 0.14);
  }
  .panel::before { content: ""; align-self: center; width: 36px; height: 4px; border-radius: 2px; background: var(--line); }
  .head { align-items: center; }
  h1 { font-size: 19px; }
  .sub { display: none; }
  .collapse { display: block; padding: 8px 12px; font-size: 13px; }
  .views { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .views button { padding: 10px 4px; text-align: center; font-size: 14px; min-height: 42px; }
  .views-label { display: none; }
  .layers { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 18px; }
  .layers .label { grid-column: 1 / -1; margin-top: 4px; }
  .toggle { padding: 8px 0; font-size: 15px; min-height: 40px; }
  .toggle small { display: none; }
  .panel.min .fold { display: none; }
}
@media (max-width: 340px) { .layers { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="stage"></div>
<div id="status">Loading the kitchen…</div>

<aside class="panel" id="panel">
  <div class="head">
    <div>
      <h1>Kitchen 3D</h1>
      <p class="sub" id="hint">Drag to orbit · scroll to zoom · right-drag to pan</p>
    </div>
    <button class="collapse" id="collapse" aria-expanded="true" aria-controls="fold">Hide layers</button>
  </div>
  <div class="body" style="display:flex;flex-direction:column;gap:14px">
    <div class="group">
      <span class="label views-label">Views</span>
      <div class="views" id="views">
        <button data-view="hob">Hob wall</button>
        <button data-view="sink">Sink wall</button>
        <button data-view="iso" aria-pressed="true">Overview</button>
        <button data-view="plan">Plan</button>
      </div>
    </div>
    <div class="fold" id="fold">
    <div class="group layers" id="walls">
      <span class="label">Walls</span>
      <label class="toggle">Hob wall <input type="checkbox" id="t-hob" data-key="hob" checked></label>
      <label class="toggle"><span>Sink wall <small>W/M side</small></span> <input type="checkbox" id="t-sink" data-key="sink" checked></label>
      <label class="toggle">Window wall <input type="checkbox" id="t-back" data-key="back" checked></label>
      <label class="toggle">Left wall <input type="checkbox" id="t-left" data-key="left"></label>
      <label class="toggle">Ceiling <input type="checkbox" id="t-ceiling" data-key="ceiling"></label>
    </div>
    <div class="group layers">
      <span class="label">Show</span>
      <label class="toggle">Upper cabinets <input type="checkbox" id="t-upper" data-key="upper" checked></label>
      <label class="toggle">Measurements <input type="checkbox" id="t-dims" data-key="dims" checked></label>
    </div>
    <p class="note">Measurements are in feet and inches, rounded to the nearest inch. The <b>3ft 3in</b> raised slab over the washing machine is an estimate.</p>
    </div>
  </div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script id="glb" type="application/octet-stream">__GLB_BASE64__</script>
<script>
// glTF axes: x along the hob wall, y up, z into the room (sink wall at x = 1.8, window wall at z = 2.93), metres
const GROUPS = {
  hob: n => n === "Wall_Hob",
  sink: n => n === "Wall_Right",
  left: n => n === "Wall_Left",
  back: n => n.startsWith("Wall_Back") || n.startsWith("Window"),
  ceiling: n => n === "Ceiling",
  upper: n => /^(HobWall_|SinkWall_|LED_|Microwave|Oven)/.test(n) || n === "Splash_Chimney" || n.startsWith("Chimney_Duct"),
  dims: n => n.startsWith("Dim_"),
};
const VIEWS = {
  hob:  { pos: [0.85, 1.5, 2.85], target: [0.85, 1.25, 0], hide: ["back", "left", "ceiling"] },
  sink: { pos: [-0.7, 1.45, 1.65], target: [1.8, 1.25, 1.65], hide: ["left", "ceiling"] },
  iso:  { pos: [-4.5, 4.0, 1.75], target: [1.0, 0.9, 1.45], hide: ["left", "ceiling"] },
  plan: { pos: [0.9, 7.5, 1.47], target: [0.9, 0, 1.46], hide: ["ceiling"] },
};

const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f8c, 0.25));
// a key light from the room side and a warm ceiling light, so the white shutters shade and the seams read
const key = new THREE.DirectionalLight(0xffffff, 1.1);
key.position.set(-2.5, 4, 4.5);
scene.add(key);
const ceilingLight = new THREE.PointLight(0xfff1dc, 0.9, 6, 2);
ceilingLight.position.set(0.9, 2.6, 1.5);
scene.add(ceilingLight);

const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 100);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxDistance = 15;
controls.addEventListener("start", () => { moved = true; anim = null; });

function paintBackground() {
  scene.background = new THREE.Color(getComputedStyle(document.body).backgroundColor);
}
paintBackground();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintBackground);
new MutationObserver(paintBackground).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

// Keep the framing on tall phone screens: hold the landscape horizontal field of view by widening the
// vertical one up to a limit, then step the camera back for whatever is left.
let anim = null;
const BASE_VFOV = 45, BASE_ASPECT = 0.85, MAX_VFOV = 70;
const halfH = Math.atan(Math.tan(THREE.MathUtils.degToRad(BASE_VFOV / 2)) * BASE_ASPECT);
let pullBack = 1;
function fitFov(aspect) {
  const need = Math.tan(halfH) / aspect;                        // tan(vfov/2) that keeps the base width in view
  const vfov = Math.min(MAX_VFOV, Math.max(BASE_VFOV, THREE.MathUtils.radToDeg(2 * Math.atan(need))));
  camera.fov = vfov;
  pullBack = Math.max(1, need / Math.tan(THREE.MathUtils.degToRad(vfov / 2)));
}

const panel = document.getElementById("panel");
function resize() {
  const phone = matchMedia("(max-width: 640px), (max-height: 520px) and (orientation: portrait)").matches;
  document.documentElement.style.setProperty("--sheet", phone ? panel.offsetHeight + "px" : "0px");
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  fitFov(camera.aspect);
  camera.updateProjectionMatrix();
  if (ready && !moved) setView(lastView, false);    // reframe the current view until the viewer moves the camera
}
let ready = false, moved = false;
addEventListener("resize", resize);
new ResizeObserver(resize).observe(panel);
resize();
if (matchMedia("(pointer: coarse)").matches)
  document.getElementById("hint").textContent = "Drag to orbit · pinch to zoom · two fingers to pan";

const members = Object.fromEntries(Object.keys(GROUPS).map(k => [k, []]));
const toggles = [...document.querySelectorAll(".toggle input")];

function apply() {
  for (const t of toggles) for (const o of members[t.dataset.key]) o.visible = t.checked;
}
toggles.forEach(t => t.addEventListener("change", apply));

function setView(key, animate = true) {
  const v = VIEWS[key];
  lastView = key; moved = false;
  document.querySelectorAll("#views button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === key)));
  for (const t of document.querySelectorAll("#walls input")) t.checked = !v.hide.includes(t.dataset.key);
  apply();
  const target = new THREE.Vector3(...v.target);
  const pos = new THREE.Vector3(...v.pos).sub(target).multiplyScalar(pullBack).add(target);
  const to = { pos, target };
  if (!animate || matchMedia("(prefers-reduced-motion: reduce)").matches) {
    camera.position.copy(to.pos); controls.target.copy(to.target); controls.update(); return;
  }
  anim = { t0: performance.now(), from: { pos: camera.position.clone(), target: controls.target.clone() }, to };
}
document.getElementById("views").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]");
  if (b) setView(b.dataset.view);
});

// on phones the layer switches start folded so the model gets most of the screen
const collapse = document.getElementById("collapse");
function fold(min) {
  panel.classList.toggle("min", min);
  collapse.textContent = min ? "Layers" : "Hide layers";
  collapse.setAttribute("aria-expanded", String(!min));
}
collapse.addEventListener("click", () => fold(!panel.classList.contains("min")));
fold(matchMedia("(max-width: 640px)").matches);
let lastView = "iso";

const b64 = document.getElementById("glb").textContent.trim();
const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
new THREE.GLTFLoader().parse(bytes.buffer, "", gltf => {
  gltf.scene.traverse(o => {
    for (const [k, test] of Object.entries(GROUPS)) if (o.name && test(o.name)) members[k].push(o);
    if (o.isMesh && o.material) o.material.envMapIntensity = 0.55;
    if (o.isMesh && o.material && o.material.transmission > 0) {   // keep the window glass see-through
      o.material.transparent = true; o.material.opacity = 0.35; o.material.transmission = 0;
    }
  });
  scene.add(gltf.scene);
  document.getElementById("status").hidden = true;
  ready = true;
  setView("iso", false);
}, err => {
  document.getElementById("status").textContent = "The model could not be loaded. Reload the page to try again.";
  console.error(err);
});

function loop(now) {
  if (anim) {
    const k = Math.min(1, (now - anim.t0) / 700), e = k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
    camera.position.lerpVectors(anim.from.pos, anim.to.pos, e);
    controls.target.lerpVectors(anim.from.target, anim.to.target, e);
    if (k === 1) anim = null;
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
